<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#111;}
  #stage{position:relative;width:1820px;height:1024px;overflow:hidden;background:#F9F7F6;}
  #card{position:absolute;inset:0;width:1820px;height:1024px;object-fit:cover;}
  svg.overlay{position:absolute;inset:0;width:1820px;height:1024px;pointer-events:none;}
  .doodle{transform-origin:center center;transform-box:fill-box;}
</style>
</head>
<body>
<div id="stage">
  <img id="card" src="card.png">
  <svg class="overlay" viewBox="0 0 1820 1024">

    <!-- PENCIL : top-left, angled -->
    <g transform="rotate(-32 290 250)"><g id="d-pencil" class="doodle" data-seed="61">
      <path d="M 205 230 L 330 230 L 330 270 L 205 270 Z" fill="none" stroke="#29ABE2" stroke-width="9" stroke-linejoin="round"/>
      <path d="M 330 230 L 374 250 L 330 270" fill="none" stroke="#29ABE2" stroke-width="9" stroke-linejoin="round"/>
      <path d="M 360 250 L 374 250" stroke="#29ABE2" stroke-width="9" stroke-linecap="round"/>
      <path d="M 222 230 L 222 270" stroke="#29ABE2" stroke-width="7"/>
      <path d="M 205 236 Q 192 250 205 264" fill="none" stroke="#29ABE2" stroke-width="9" stroke-linecap="round"/>
    </g></g>

    <!-- APPLE : top-right -->
    <g id="d-apple" class="doodle" data-seed="62">
      <path d="M 1545 232 C 1508 210 1476 246 1492 292 C 1503 325 1530 335 1545 316 C 1560 335 1587 325 1598 292 C 1614 246 1582 210 1545 232 Z" fill="none" stroke="#29ABE2" stroke-width="9" stroke-linejoin="round"/>
      <path d="M 1545 230 L 1552 200" stroke="#29ABE2" stroke-width="8" stroke-linecap="round"/>
      <path d="M 1552 206 Q 1582 192 1590 214 Q 1566 222 1552 206 Z" fill="none" stroke="#29ABE2" stroke-width="7" stroke-linejoin="round"/>
    </g>

    <!-- OPEN BOOK : bottom-left -->
    <g id="d-book" class="doodle" data-seed="63">
      <path d="M 300 762 C 250 746 200 751 176 763 L 176 858 C 200 845 250 840 300 856 Z" fill="none" stroke="#29ABE2" stroke-width="9" stroke-linejoin="round"/>
      <path d="M 300 762 C 350 746 400 751 424 763 L 424 858 C 400 845 350 840 300 856 Z" fill="none" stroke="#29ABE2" stroke-width="9" stroke-linejoin="round"/>
      <path d="M 300 762 L 300 856" stroke="#29ABE2" stroke-width="7"/>
      <path d="M 272 786 q -34 -6 -68 4 M 272 806 q -34 -6 -68 4 M 272 826 q -34 -6 -68 4" fill="none" stroke="#29ABE2" stroke-width="5" stroke-linecap="round"/>
      <path d="M 328 786 q 34 -6 68 4 M 328 806 q 34 -6 68 4 M 328 826 q 34 -6 68 4" fill="none" stroke="#29ABE2" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- RULER : bottom-right, angled -->
    <g transform="rotate(34 1520 805)"><g id="d-ruler" class="doodle" data-seed="64">
      <path d="M 1430 783 L 1612 783 L 1612 827 L 1430 827 Z" fill="none" stroke="#29ABE2" stroke-width="9" stroke-linejoin="round"/>
      <path d="M 1452 783 L 1452 806 M 1478 783 L 1478 799 M 1504 783 L 1504 806 M 1530 783 L 1530 799 M 1556 783 L 1556 806 M 1582 783 L 1582 799" stroke="#29ABE2" stroke-width="6" stroke-linecap="round"/>
    </g></g>

  </svg>
</div>

<script>
const DUR = 3.0;
function prand(seed, fi, k){ const x = Math.sin(seed*127.1 + fi*311.7 + k*74.7)*43758.5453; return x - Math.floor(x); }
function boil(seed, t, amp){ const fi = Math.floor(t*8);
  const dx = (prand(seed,fi,1)-.5)*2*amp, dy = (prand(seed,fi,2)-.5)*2*amp, dr = (prand(seed,fi,3)-.5)*2.2;
  return 'translate('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px) rotate('+dr.toFixed(2)+'deg)'; }
function popScale(p){ if(p<=0) return 0; if(p>=1) return 1; const o=1.7; const q=p; return 1 + (o*Math.pow(q-1,3) + (o-1)*Math.pow(q-1,2)); }
function popAt(t, tIn){ return popScale(Math.min(Math.max((t - tIn)/0.45, 0), 1)); }

const DOODLES = [
  {id:'d-pencil', tIn:0.45, seed:61},
  {id:'d-apple',  tIn:0.70, seed:62},
  {id:'d-book',   tIn:0.95, seed:63},
  {id:'d-ruler',  tIn:1.20, seed:64},
];

window.renderFrame = function(t){
  t = Math.min(Math.max(t,0), DUR-0.001);
  // card fades up from cream
  const card = document.getElementById('card');
  card.style.opacity = Math.min(t/0.35, 1).toFixed(3);
  // doodles pop in + boil
  for(const d of DOODLES){
    const el = document.getElementById(d.id);
    const s = popAt(t, d.tIn);
    el.style.opacity = s<=0 ? 0 : 1;
    el.style.transform = 'scale('+Math.max(s,0.001).toFixed(3)+') ' + boil(d.seed, t, 2.6);
  }
};
renderFrame(0);
</script>
</body>
</html>
